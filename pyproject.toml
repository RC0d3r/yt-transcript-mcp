[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "yt-transcript-mcp"
version = "0.1.0"
description = "Curate YouTube history and search selected transcripts with FTS5, ChromaDB and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=1.12,<2", "youtube-transcript-api>=1.0,<2",
  "chromadb>=1.0,<2", "sentence-transformers>=3,<6", "yt-dlp>=2025.1",
]

[project.scripts]
yt-mcp = "yt_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
